name: Check

# Builds the example thesis on Windows, macOS and Linux: pixi install, import
# the Word chapters, render the Word file. Runs only in the template itself,
# not in theses made from it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'eLearningHub/quarto-thesis-starter'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.72.2
        cache: true

    - name: Import the Word chapters
      run: pixi run import

    - name: Render the thesis in the template
      run: pixi run word

    - name: The Word file was made
      shell: bash
      run: ls -l _book/*.docx

    - uses: actions/upload-artifact@v4
      with:
        name: thesis-${{ matrix.os }}
        path: _book/*.docx
