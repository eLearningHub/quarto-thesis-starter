name: Check

# Builds the example thesis on Windows, macOS and Linux, plain and with the
# Concordia profile (doctoral everywhere, master's on Linux), and the PDF/A
# on Linux and Windows. Runs only in the template itself, not in theses made
# from it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'eLearningHub/quarto-thesis-starter'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        thesis: [plain, concordia-doctoral, concordia-masters]
        exclude:
          - { os: windows-latest, thesis: concordia-masters }
          - { os: macos-latest, thesis: concordia-masters }
    name: ${{ matrix.thesis }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.72.2
        cache: true

    - name: Import the Word chapters
      run: pixi run import

    - name: Concordia profile
      if: startsWith(matrix.thesis, 'concordia')
      shell: bash
      run: |
        pixi run concordia
        echo "QUARTO_PROFILE=concordia" >> "$GITHUB_ENV"

    - name: Master's
      if: matrix.thesis == 'concordia-masters'
      shell: bash
      run: sed -i.bak 's/^  degree-level: doctoral.*/  degree-level: masters/' _quarto-concordia.yml

    - name: Render the thesis
      run: pixi run word

    - name: LibreOffice (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

    - name: LibreOffice (Windows)
      if: runner.os == 'Windows'
      run: choco install libreoffice-fresh -y --no-progress

    - name: PDF/A
      if: runner.os != 'macOS'
      run: pixi run pdf

    - name: Check what was made
      shell: bash
      run: pixi run python .github/scripts/check_output.py ${{ startsWith(matrix.thesis, 'concordia') && 'concordia' || '' }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.thesis }}-${{ matrix.os }}
        path: _book/*.*
